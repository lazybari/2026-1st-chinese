<!doctype html>
<html lang="ko">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- ▼ GitHub에 올릴 때: content="" 따옴표 안에 Apps Script 웹 앱 주소(끝이 /exec)를 붙여 넣으세요 ▼ -->
<meta name="app-api" content="https://script.google.com/macros/s/AKfycbxf7g1qF-OzyC5EBt_WPkrm34pMupOPnv3TB4Nhw1fqpiQ1kKin9iE1TvKjc0gCUYc_/exec">
<title>중국어 단어·문장 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.29.4/dist/index.js" async></script>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --felt:#1E5A48; --felt-lit:#2A735C; --felt-deep:#133F32;
  --ivory:#FBF6E4; --ivory-2:#E7DDBF; --paper:#FFFDF6; --jade:#2F8E6C;
  --ink:#2B211C; --ink-2:#6B5F54; --red:#C23A2B; --blue:#2B5A86; --yellow:#E3A600; --py-ink:#8A6200;
  --tile-hi:#FFFDF4; --tile-mid:#F7EFD8; --tile-lo:#E9DDBB; --tile-side:#D9CAA0;
  --on-felt:#F3EEDD; --muted:#B9D2C4; --py-light:#FFE08A; --gold:#F2C14E;
  --ok:#2F9E4B; --ok-bg:#E6F6E9; --ok-line:#8BE39A; --bad:#C23A2B; --bad-bg:#FDECEA; --bad-line:#FF9A8A;
  --zh:"Noto Serif SC","Songti SC","STSong",serif;     /* 간화자 폰트 (설정 탭에서 바뀜) */
  --pyf:"Andika","Nunito","Segoe UI",sans-serif;      /* 병음 폰트 (설정 탭에서 바뀜) */
  --num:Nunito,"Segoe UI",sans-serif;                 /* 숫자·점수 */
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--felt);
  background-image:radial-gradient(ellipse at 50% 30%,var(--felt-lit) 0%,var(--felt) 55%,var(--felt-deep) 100%);background-attachment:fixed;
  color:var(--on-felt);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
button{font:inherit;color:inherit}
input{font:inherit}
.zh{font-family:var(--zh);font-weight:700}
.py{font-family:var(--pyf);font-weight:700}

/* 병음을 간화자 위에 */
.zp{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;line-height:1.1}
.zp .p{font-family:var(--pyf);font-weight:700;font-size:max(17px,.56em);color:#7A5200;white-space:nowrap;margin-bottom:.1em}
.zp .h{font-family:var(--zh);font-weight:700}
.zline{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:.08em .12em}
.zline .pu{font-family:var(--zh);font-weight:700}

/* ---------- 머리 ---------- */
.top{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-left));
  background:rgba(14,48,38,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border-bottom:1px solid rgba(255,255,255,.08)}
.brand{display:flex;align-items:center;gap:8px;font-size:17px;min-width:0;cursor:pointer}
.brand .seal{width:32px;height:32px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--zh);font-weight:700;font-size:19px;flex:none}
.brand span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.who{font-size:14px;color:var(--muted);white-space:nowrap}
.who b{color:var(--on-felt);font-weight:400}
.app{max-width:980px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left)) 40px;display:flex;flex-direction:column;gap:14px}

/* ---------- 버튼 ---------- */
.btn{border:1px solid rgba(255,255,255,.32);background:rgba(0,0,0,.12);color:var(--on-felt);padding:10px 16px;border-radius:12px;font-size:16px;cursor:pointer;
  touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#2B211C}
.btn.okb{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.small{padding:6px 12px;font-size:14px;min-height:36px;border-radius:10px}
.btn.big{font-size:18px;padding:13px 22px}
.btn.block{width:100%}
.btn:disabled{opacity:.42;cursor:default}
.btn:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.paper .btn{color:var(--ink);border-color:rgba(0,0,0,.18);background:#fff}
.paper .btn.red{color:#fff;background:var(--red);border-color:var(--red)}
.paper .btn.gold{background:var(--gold);border-color:var(--gold)}
.say{border:0;background:rgba(0,0,0,.06);border-radius:10px;padding:6px 10px;font-size:15px;cursor:pointer;min-height:36px;touch-action:manipulation}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.center{justify-content:center}

/* ---------- 종이 카드 ---------- */
.paper{background:var(--paper);color:var(--ink);border-radius:18px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.paper h2{margin:0 0 8px;font-size:22px;font-weight:400}
.paper h3{margin:0 0 8px;font-size:18px;font-weight:400}
.muted{color:var(--ink-2)}
.on-felt-muted{color:var(--muted)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pagehead h1{margin:0;font-size:clamp(24px,4vw,32px);font-weight:400;line-height:1.2}
.pagehead .sub{color:var(--muted);font-size:15px;margin-top:4px}
.err{color:var(--red);font-size:15px;min-height:20px}
.note{font-size:14px;color:var(--muted)}
.label{font-size:15px;color:var(--muted);text-align:center;margin:0}
.label.go{color:var(--py-light)}

/* ---------- 로그인 ---------- */
.login{max-width:420px;margin:6vh auto 0;text-align:center}
.login .seal{width:64px;height:64px;margin:0 auto 10px;border-radius:16px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--zh);font-weight:700;font-size:36px}
.field{display:flex;flex-direction:column;gap:6px;text-align:left;margin:12px 0}
.field label{font-size:15px;color:var(--ink-2)}
.field input{font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid #CFC5A8;background:#fff;color:var(--ink);width:100%}
.field input:focus{border-color:var(--gold);outline:none}

/* ---------- 단원 목록 ---------- */
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.ucard{background:var(--paper);color:var(--ink);border-radius:18px;padding:18px;cursor:pointer;border:3px solid transparent;text-align:left;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),3px 4px 0 0 var(--tile-side),6px 8px 0 0 var(--jade),8px 14px 16px rgba(0,0,0,.3);touch-action:manipulation}
.ucard:active{transform:translateY(2px)}
.ucard .nm{font-size:22px;line-height:1.25}
.ucard .ds{font-size:14px;color:var(--ink-2);margin-top:4px;min-height:18px}
.ucard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:14px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:#E5DCC2;display:block}
.dots i.on{background:var(--ok)}
.score-pill{font-family:var(--num);font-weight:800;font-size:18px}
.score-pill small{font-family:inherit;font-weight:400;color:var(--ink-2);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:3px 8px;border-radius:999px;background:#EFE7CF;color:var(--ink-2);margin-left:6px;vertical-align:middle}
.tag.done{background:var(--ok-bg);color:var(--ok)}

/* ---------- 단계 ---------- */
.stages{display:flex;flex-direction:column;gap:10px}
.stage{display:flex;align-items:center;gap:14px;background:var(--paper);color:var(--ink);border-radius:16px;padding:14px 16px;border:0;text-align:left;cursor:pointer;width:100%;
  box-shadow:3px 4px 0 0 var(--tile-side),5px 7px 10px rgba(0,0,0,.25);touch-action:manipulation;min-height:72px}
.stage:active{transform:translateY(2px)}
.stage .num{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:800;font-size:20px;flex:none}
.stage .t{font-size:19px}
.stage .s{font-size:14px;color:var(--ink-2);margin-top:2px}
.stage .r{margin-left:auto;text-align:right;white-space:nowrap}
.stage.done .num{background:var(--ok)}
.stage.locked{opacity:.55;cursor:default;background:#E9E1C8}
.stage.locked .num{background:#9C9381}
.stage.next{outline:3px solid var(--gold);outline-offset:2px}
.big-score{font-family:var(--num);font-weight:800;font-size:22px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.18);color:var(--on-felt);padding:9px 16px;border-radius:999px;font-size:15px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--gold);border-color:var(--gold);color:#2B211C}
.wl{width:100%;border-collapse:collapse}
.wl td{padding:9px 6px;border-bottom:1px solid var(--ivory-2);font-size:16px;vertical-align:middle}
.wl td.h{font-size:24px;white-space:nowrap}
.wl td.s{width:1%;white-space:nowrap}
.sl{margin:0;padding:0}
.sl li{padding:12px 0;border-bottom:1px solid var(--ivory-2);list-style:none}
.sl .py{color:var(--py-ink);font-size:16px}
.sl .zh{font-size:24px;line-height:1.35}

/* ---------- 학습 카드 (어휘·문장) ---------- */
.counter{font-family:var(--num);font-weight:800;color:var(--muted)}
.fwrap{perspective:1200px;width:min(580px,100%);margin:0 auto}
.fcard{position:relative;width:100%;aspect-ratio:1.45/1;cursor:pointer;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1);border:0;padding:0;background:none;display:block}
.fcard.sent{aspect-ratio:auto;height:clamp(250px,46vw,330px)}
.fcard.up{transform:rotateY(180deg)}
.fside{position:absolute;inset:0;border-radius:22px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:18px;
  background:linear-gradient(155deg,var(--tile-hi) 0%,var(--tile-mid) 55%,var(--tile-lo) 100%);color:var(--ink);border:4px solid var(--red);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),3px 4px 0 0 var(--tile-side),6px 8px 0 0 var(--jade),9px 16px 18px rgba(0,0,0,.35)}
.fside.back{transform:rotateY(180deg);border-color:var(--blue)}
.fside .wpy{font-family:var(--pyf);font-weight:700;color:var(--py-ink);font-size:clamp(24px,4.4vw,36px);line-height:1.1}
.fside .wzh{font-family:var(--zh);font-weight:700;font-size:clamp(56px,13vw,108px);line-height:1.1}
.fside.back .wzh{font-size:clamp(40px,8vw,64px)}
.fside .spy{font-family:var(--pyf);font-weight:700;color:var(--py-ink);font-size:clamp(18px,3vw,24px);text-align:center;line-height:1.3}
.fside .szh{font-family:var(--zh);font-weight:700;font-size:clamp(30px,5.6vw,46px);text-align:center;line-height:1.3}
.fside.back .szh{font-size:clamp(24px,4.4vw,36px)}
.fside .ko{font-size:clamp(20px,3.4vw,27px);color:var(--blue);text-align:center;word-break:keep-all;margin-top:4px}
.fside small{font-size:14px;color:var(--ink-2);margin-top:6px}
.pbar{height:8px;border-radius:4px;background:rgba(255,255,255,.18);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--gold);transition:width .3s ease}
.steps{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.steps i{width:22px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}
.steps i.ok{background:var(--ok-line)} .steps i.now{background:var(--gold)}
@media (prefers-reduced-motion: reduce){.fcard{transition:none}}

/* ---------- 게임 고르기 ---------- */
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.gcard{background:var(--paper);color:var(--ink);border-radius:16px;padding:16px;border:0;text-align:left;cursor:pointer;box-shadow:3px 4px 0 0 var(--tile-side),5px 8px 12px rgba(0,0,0,.25);touch-action:manipulation}
.gcard:active{transform:translateY(2px)}
.gcard .ic{font-size:30px}
.gcard .nm{font-size:19px;margin-top:4px}
.gcard .ds{font-size:14px;color:var(--ink-2);margin-top:2px;min-height:36px}
.gcard .bs{font-family:var(--num);font-weight:800;font-size:15px;margin-top:8px;color:var(--ok)}
.gcard .bs.none{color:var(--ink-2);font-family:inherit;font-weight:400}

/* ---------- 상아 타일 ---------- */
.tile{background:linear-gradient(155deg,var(--tile-hi) 0%,var(--tile-mid) 55%,var(--tile-lo) 100%);color:var(--ink);border:3px solid var(--ivory-2);border-radius:14px;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.95),2px 3px 0 0 var(--tile-side),4px 6px 0 0 var(--jade),5px 9px 10px rgba(0,0,0,.3);
  cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;text-align:center;padding:8px 12px;line-height:1.2;word-break:keep-all;overflow-wrap:anywhere;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .1s ease,opacity .3s ease}
.tile:active{transform:translateY(2px)}
.tile.k-hz{border-color:var(--red);font-size:clamp(26px,3.6vw,36px)}
.tile.k-ko{border-color:var(--blue);color:var(--blue);font-size:clamp(17px,2.3vw,22px)}
.tile.sel{background:linear-gradient(155deg,#FFF8DC,#FFE08A);outline:3px solid #fff;outline-offset:1px;transform:translateY(-3px)}
.tile.ok{background:var(--ok-bg);border-color:var(--ok)}
.tile.ng{background:var(--bad-bg);border-color:var(--bad)}
.tile.gone{opacity:.25;pointer-events:none}
.tile.shake{animation:shake .35s}
.tile:disabled{cursor:default}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){.tile.shake{animation:none}}

.gstat{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.gstat div{text-align:center;min-width:44px}
.gstat b{display:block;font-family:var(--num);font-weight:800;font-size:22px}
.gstat span{font-size:13px;color:var(--muted)}

.match{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px}
.match .col{display:flex;flex-direction:column;gap:12px}
.match .tile{min-height:76px}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;max-width:760px;width:100%;margin:0 auto}
@media (max-width:520px){.mem{grid-template-columns:repeat(3,minmax(0,1fr))}}
.mc{position:relative;aspect-ratio:1.2/1;perspective:900px;border:0;padding:0;background:none;cursor:pointer;touch-action:manipulation}
.mc .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .4s ease}
.mc.up .in{transform:rotateY(180deg)}
.mc .sd{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 6px;line-height:1.15;word-break:keep-all;
  box-shadow:2px 3px 0 0 var(--tile-side),4px 6px 0 0 var(--felt-deep),5px 9px 10px rgba(0,0,0,.35)}
.mc .bk{background:linear-gradient(155deg,#3AA07C,#2F8E6C 50%,#23704F);border:3px solid #F3E7C4;color:#F3E7C4;font-family:var(--zh);font-weight:700;font-size:clamp(22px,3.2vw,32px)}
.mc .fr{transform:rotateY(180deg);background:linear-gradient(155deg,var(--tile-hi),var(--tile-mid) 55%,var(--tile-lo));color:var(--ink);border:3px solid var(--ivory-2)}
.mc.k-hz .fr{border-color:var(--red);font-size:clamp(24px,3.6vw,36px)}
.mc.k-ko .fr{border-color:var(--blue);color:var(--blue);font-size:clamp(15px,2.2vw,22px)}
.mc.done .fr{outline:3px solid var(--ok-line);outline-offset:1px}
.mc.done{opacity:.45;transition:opacity .5s ease .5s}
.mc.miss .fr{outline:3px solid var(--bad-line);outline-offset:1px}
@media (prefers-reduced-motion: reduce){.mc .in{transition:none}}

.qcard{text-align:center;padding:22px 18px}
.qcard .ask{font-size:15px;color:var(--ink-2);margin-bottom:8px}
.qcard .big{font-size:clamp(50px,10vw,84px)}
.qcard .ko{font-size:clamp(22px,3.6vw,30px);color:var(--blue)}
.qcard .sent{font-size:clamp(28px,4.8vw,42px)}
.blank{display:inline-flex;flex-direction:column;align-items:center;vertical-align:bottom;line-height:1.1}
.blank .p{font-size:max(17px,.56em);visibility:hidden;margin-bottom:.1em}
.blank .h{min-width:2.2em;border-bottom:4px solid var(--gold);color:var(--gold);font-family:var(--zh);font-weight:700;text-align:center}
.zp.filled .h{color:var(--ok)}
.bigsay{font-size:40px;width:110px;height:110px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;box-shadow:0 6px 0 #8E2A1F;touch-action:manipulation}
.bigsay:active{transform:translateY(3px);box-shadow:0 3px 0 #8E2A1F}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.opts .tile{min-height:84px}
.fb{padding:12px 14px;border-radius:12px;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fb.ok{background:var(--ok-bg);color:var(--ok)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb .zp{font-size:24px}
.fb .zp .p{color:inherit}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- 녹음 ---------- */
.rec-panel{display:flex;align-items:center;gap:12px;background:#FFF1EF;color:var(--ink);border-radius:12px;padding:10px 12px;flex-wrap:wrap;text-align:left}
.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--red);animation:blink 1s infinite;flex:none}
@keyframes blink{50%{opacity:.25}}
.meter{flex:1;min-width:120px;height:14px;border-radius:7px;background:#EAD9D5;overflow:hidden;position:relative}
.meter span{position:absolute;left:0;top:0;bottom:0;background:var(--red);border-radius:7px;transition:width .08s linear}
.meter.time span{background:var(--gold)}
.recbox{display:flex;flex-direction:column;gap:10px}
.saved{font-size:14px;color:var(--muted)}
.saved.ok{color:var(--ok-line)} .saved.no{color:var(--bad-line)}
.btn.rec{background:var(--red);border-color:var(--red);color:#fff;font-size:19px;padding:14px 26px}
.okline{color:var(--ok-line);font-size:16px}

/* ---------- 문장 게임 ---------- */
.line{min-height:96px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:16px;border:2px dashed rgba(255,255,255,.5);background:rgba(0,0,0,.16)}
.line.ok{border:3px solid var(--ok-line);background:rgba(47,158,75,.18)}
.line .ph{color:var(--muted);font-size:15px}
.pool{min-height:96px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:12px;border-radius:16px;background:rgba(0,0,0,.24)}
.pc{min-width:64px;min-height:70px;padding:6px 14px;font-size:clamp(26px,3.6vw,34px)}
.punct{font-family:var(--zh);font-weight:700;font-size:30px;color:var(--on-felt);align-self:flex-end;padding-bottom:10px}
.result-big{font-family:var(--num);font-weight:800;font-size:64px;color:var(--red);line-height:1}
.result-sub{font-size:16px;color:var(--ink-2)}
.badge{display:inline-block;background:var(--gold);color:#2B211C;border-radius:999px;padding:4px 12px;font-size:14px}
.overlay{position:fixed;inset:0;background:rgba(8,28,22,.6);display:flex;align-items:center;justify-content:center;z-index:900;padding:16px}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.3);border-top-color:var(--gold);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.center{text-align:center}
.gtable{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.gtable td{padding:7px 4px;border-bottom:1px solid var(--ivory-2);text-align:left}

<script>

<script>
/* ======================== 도우미 ======================== */
const $ = (s, el) => (el || document).querySelector(s);
const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const key = x => String(x).replace(/[\s。．.，,！!？?]/g, '').toLowerCase();
function uniqBy(list, f){ const seen = new Set(); return list.filter(x => { const k = key(f(x)); if (!k || seen.has(k)) return false; seen.add(k); return true; }); }
/* 서버(구글 시트) 부르기
   - Apps Script 주소로 열었을 때: google.script.run
   - GitHub Pages로 열었을 때: 맨 위 app-api 주소로 fetch */
const API_URL = ((document.querySelector('meta[name="app-api"]') || {}).content || '').trim();
const IN_GAS = !!(window.google && google.script && google.script.run);
const API_OK = /^https:\/\/script\.google\.com\/\S+\/exec$/.test(API_URL);
function call(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  if (IN_GAS) return new Promise((ok, no) => { google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn].apply(null, args); });
  if (!API_OK) return Promise.reject(new Error('선생님: index.html 맨 위 app-api 칸에 웹 앱 주소(끝이 /exec)를 넣어 주세요.'));
  return apiFetch(fn, args, fn === 'saveAudio' ? 120000 : 40000, fn !== 'saveAudio');
}
async function apiFetch(fn, args, ms, retry){
  for (let attempt = 0; ; attempt++){
    const ctl = window.AbortController ? new AbortController() : null;
    const timer = ctl ? setTimeout(() => ctl.abort(), ms) : null;
    try {
      /* text/plain 으로 보내야 브라우저가 미리 확인 요청 없이 바로 보냄 (Apps Script는 그 확인 요청을 못 받음) */
      const res = await fetch(API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' },
        body: JSON.stringify({ fn, args }), redirect:'follow', signal: ctl ? ctl.signal : undefined });
      const txt = await res.text();
      let j;
      try { j = JSON.parse(txt); }
      catch(e){ const er = new Error('서버 응답을 읽지 못했어요. (선생님: 웹 앱 배포의 액세스가 "모든 사용자"인지, app-api 주소가 맞는지 확인해 주세요)'); er.server = true; throw er; }
      if (!j.ok){ const er = new Error(j.error || '서버에서 문제가 생겼어요.'); er.server = true; throw er; }

      await new Promise(r => setTimeout(r, 900));   /* 한 번 더 시도 */
    } finally { if (timer) clearTimeout(timer); }

const errText = e => (e && e.message ? String(e.message).replace(/^(Exception|Error):\s*/, '') : '') || '인터넷 연결을 확인하고 다시 해 주세요.';

const isHan = c => /[㐀-鿿]/.test(c);
const isZh = s => /[㐀-鿿]/.test(s) && !/[가-힣]/.test(s);
function pickOthers(answer, pool, n){
  const a = key(answer);
  return shuffle(uniqBy(pool.filter(x => key(x) !== a), x => x)).slice(0, n);
}

/* ======================== 폰트 (설정 탭의 Google Fonts 이름) ======================== */
/* 구글 폰트 주소 (빗금 두 개를 한 줄에 쓰지 않도록 나눠 씀) */
const GF_URL = 'https:' + '/' + '/fonts.googleapis.com/css2?family=';
function loadFont(name){
  const fam = String(name || '').replace(/[^A-Za-z0-9 ]/g, '').trim();
  if (!fam) return;
  const q = fam.replace(/\s+/g, '+'), l = document.createElement('link');
  l.rel = 'stylesheet';
  l.href = GF_URL + q + ':wght@400;700&display=swap';
  /* 굵기 700이 없는 폰트는 기본 굵기로 다시 불러온다 */
  l.onerror = () => { const l2 = document.createElement('link'); l2.rel = 'stylesheet'; l2.href = GF_URL + q + '&display=swap'; document.head.appendChild(l2); };
  document.head.appendChild(l);
}
let FONTS_ON = '';
/* 폰트 파일 주소(GitHub Pages 등)를 쓰면 @font-face 로 직접 불러온다 — 브라우저가 한 번 받은 뒤 저장해 두고 다시 씀 */
function fileFont(fam, url){
  const fmt = /^data:font\/woff2|\.woff2(\?|$)/i.test(url) ? 'woff2' : /\.woff(\?|$)/i.test(url) ? 'woff' : /\.otf(\?|$)/i.test(url) ? 'opentype' : 'truetype';
  const st = document.createElement('style');
  /* 굵기가 하나뿐인 폰트도 억지로 두껍게 만들지 않도록 모든 굵기에 같은 글꼴을 씀 */
  st.textContent = `@font-face{font-family:"${fam}";src:url("${url}") format("${fmt}");font-weight:100 900;font-display:swap}`;
  document.head.appendChild(st);

function applyFonts(c){
  c = c || {};
  let zh = c.zhFont || 'Noto Serif SC', py = c.pyFont || 'Andika';
  const sig = [zh, py, c.zhUrl, c.pyUrl].join('|');
  if (FONTS_ON === sig) return;
  FONTS_ON = sig;
  if (c.zhUrl){ zh = 'ClassZh'; fileFont(zh, c.zhUrl); } else loadFont(zh);
  if (c.pyUrl){ py = 'ClassPy'; fileFont(py, c.pyUrl); }
  else if (py !== zh) loadFont(py);
  const r = document.documentElement.style;

/* 앱 제목·폰트: 저장해 둔 설정으로 먼저 그리고, 서버에서 새로 받아 바꿈 */
window.CFG = (function(){ try { return JSON.parse(localStorage.getItem('cw-cfg') || 'null'); } catch(e){ return null; } })();
try { applyFonts(window.CFG || {}); } catch(e){}
/* 이 화면의 버전. Code.gs 의 APP_VER 와 같아야 해요 */

/* ======================== 병음 나누기 (문장 병음 → 조각별 병음) ======================== */
const MARK = {};
[['a','āáǎà'],['e','ēéěè'],['i','īíǐì'],['o','ōóǒò'],['u','ūúǔù'],['v','ǖǘǚǜ']].forEach(([b, s]) =>
  [...s].forEach(c => { MARK[c] = b; MARK[c.toUpperCase()] = b; }));

const FINALS = new Set('a o e ai ei ao ou an en ang eng ong er i ia ie iao iu ian in iang ing iong u ua uo uai ui uan un uang ueng v ve van vn ue'.split(' '));
function validSyl(b){
  for (const ini of INITIALS){ if (!b.startsWith(ini)) continue; const f = b.slice(ini.length); if (f && FINALS.has(f)) return true; }

/* 병음을 n개 음절로 나눔 (실패하면 null) */
function splitPinyin(py, n){
  const L = [], cuts = new Set();
  for (const ch of String(py)){
    if (/[\s'’\-·.,!?;:"“”。，！？、；：…]/.test(ch)){ cuts.add(L.length); continue; }

  const N = L.length; if (!N || !n) return null;
  const base = L.map(x => x.b).join(''), INF = 1e9;
  const best = Array.from({ length:N + 1 }, () => new Array(n + 1).fill(INF));
  const from = Array.from({ length:N + 1 }, () => new Array(n + 1).fill(-1));
  best[0][0] = 0;
  for (let i = 1; i <= N; i++) for (let j = Math.max(0, i - 6); j < i; j++){
    let spans = false; for (let c = j + 1; c < i; c++) if (cuts.has(c)){ spans = true; break; }
    if (spans) continue;
    const sb = base.slice(j, i);
    if (!validSyl(sb) || L.slice(j, i).filter(x => x.t).length > 1) continue;
    const pen = (j > 0 && !cuts.has(j) && /^[aoe]/.test(sb)) ? 1 : 0;
    for (let k = 1; k <= n; k++) if (best[j][k - 1] + pen < best[i][k]){ best[i][k] = best[j][k - 1] + pen; from[i][k] = j; }
  }
  if (best[N][n] >= INF) return null;
  const out = []; let i = N, k = n;
  while (k > 0){ const j = from[i][k]; out.unshift(L.slice(j, i).map(x => x.d).join('').toLowerCase()); i = j; k--; }
  return out;
}
/* 단원 데이터 준비: 조각마다 병음, 한자→병음 사전 */
function prepUnit(d){
  const map = {};
  const put = (h, p) => { const k = key(h); if (k && p && !map[k]) map[k] = p; };
  d.words.forEach(w => put(w.h, w.p));
  d.sentences.forEach(s => {
    const hans = Array.from(s.zh).filter(isHan), n = hans.length;
    const syl = n ? splitPinyin(s.py, n) : null;
    const counts = s.pieces.map(p => Array.from(p).filter(isHan).length);
    if (syl && counts.reduce((a, b) => a + b, 0) === n){
      let k = 0;
      s.ppy = s.pieces.map((p, i) => { const x = syl.slice(k, k + counts[i]); k += counts[i]; return x.join(''); });
      s.pieces.forEach((p, i) => put(p, s.ppy[i]));
      hans.forEach((ch, c) => put(ch, syl[c]));
    }
  });
  d.pymap = map;
  d.sentences.forEach(s => { if (!s.ppy) s.ppy = s.pieces.map(p => pyOf(p, map)); });
  return d;
}
function pyOf(h, map){
  map = map || (D() && D().pymap) || {};
  const k = key(h); if (map[k]) return map[k];
  const cs = Array.from(h).filter(isHan);
  return cs.length && cs.every(c => map[c]) ? cs.map(c => map[c]).join('') : '';
}
/* 병음 위 + 간화자 아래 */
const zp = (h, p, cls) => `<span class="zp${cls ? ' ' + cls : ''}" lang="zh-CN"><span class="p" lang="zh-Latn">${esc(p || ' ')}</span><span class="h">${esc(h)}</span></span>`;
const tailPunct = zh => (String(zh).match(/[。．.！!？?]+$/) || [''])[0];
/* 문장을 조각별로 (병음 위). blankAt: 빈칸 자리, fill: 정답 채워 보이기 */
function sentHtml(s, blankAt, fill){
  return `<div class="zline">${s.pieces.map((p, i) => i === blankAt
    ? (fill ? zp(p, s.ppy[i], 'filled') : '<span class="blank"><span class="p">&nbsp;</span><span class="h">？</span></span>')
    : zp(p, s.ppy[i])).join('')}<span class="pu">${esc(tailPunct(s.zh))}</span></div>`;
}

let VOICE = null;
function pickVoice(){
  try {
    const vs = speechSynthesis.getVoices();
    VOICE = vs.find(v => /zh[-_]CN/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang) && !/HK|TW/i.test(v.lang)) || vs.find(v => /^zh/i.test(v.lang)) || null;
  } catch(e){}
}
if ('speechSynthesis' in window){ pickVoice(); try { speechSynthesis.onvoiceschanged = pickVoice; } catch(e){} }
const RATE = { word: 0.8, sent: 0.75, slow: 0.5 };
function speak(text, rate){
  if (!('speechSynthesis' in window) || !text) return;
  try {
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(text));
    u.lang = 'zh-CN'; if (VOICE) u.voice = VOICE; u.rate = rate || RATE.word;
    speechSynthesis.speak(u);
  } catch(e){}
}

/* ======================== ① 어휘 학습: 1단계 카드(무작위 순서) → 2단계 뜻 보고 고르기 ======================== */
function vocabLearn(){
  const W = shuffle(D().words), t0 = Date.now(), heard = new Set(), memo = new Set();
  let i = 0, up = false;
  show(`${backBar('어휘 학습 메뉴')}
    <div class="qmeta"><div class="pagehead"><h1>🎴 카드로 익히기</h1></div><div class="counter" id="cnt"></div></div>
    <div class="pbar"><span id="pb"></span></div>
    <div id="slot" style="display:flex;flex-direction:column;gap:14px"></div>`);
  bindBack(learnHub);
  const okAt = k => heard.has(k) && memo.has(k);
  function render(){
    const w = W[i], last = i === W.length - 1, allOk = W.every((_, k) => okAt(k));
    $('#cnt').textContent = (i + 1) + ' / ' + W.length;
    $('#pb').style.width = (memo.size / W.length * 100) + '%';
    const hint = okAt(i) ? (last ? '카드를 다 봤어요! [카드로 익히기 완료]를 눌러요' : '잘했어요! 다음 단어로 가요')
      : !heard.has(i) ? '🔊 듣기를 눌러 발음을 들어 보세요' : '다 외웠으면 [외웠어요]를 눌러요';
    $('#slot').innerHTML = `
      <div class="fwrap"><button class="fcard ${up ? 'up' : ''}" type="button" id="fc" aria-label="카드 뒤집기">
        <div class="fside"><div class="wpy" lang="zh-Latn">${esc(w.p)}</div><div class="wzh" lang="zh-CN">${esc(w.h)}</div><small>눌러서 뜻 보기</small></div>
        <div class="fside back"><div class="wpy" lang="zh-Latn">${esc(w.p)}</div><div class="wzh" lang="zh-CN">${esc(w.h)}</div><div class="ko">${esc(w.k)}</div></div>
      </button></div>
      <div class="row center">
        <button class="btn big ${heard.has(i) ? 'okb' : ''}" type="button" id="hear">🔊 듣기${heard.has(i) ? ' ✓' : ''}</button>
        <button class="btn big ${memo.has(i) ? 'okb' : 'gold'}" type="button" id="memo" ${heard.has(i) ? '' : 'disabled'}>${memo.has(i) ? '✓ 외웠어요' : '외웠어요'}</button>
      </div>
      <p class="label ${okAt(i) ? 'go' : ''}">${hint}</p>
      <div class="row center">
        <button class="btn big" type="button" id="prev" ${i === 0 ? 'disabled' : ''}>◀ 이전</button>
        ${last ? `<button class="btn red big" type="button" id="toCheck" ${allOk ? '' : 'disabled'}>카드로 익히기 완료</button>`
               : `<button class="btn red big" type="button" id="next" ${okAt(i) ? '' : 'disabled'}>다음 ▶</button>`}
      </div>`;
    $('#fc').addEventListener('click', () => { up = !up; $('#fc').classList.toggle('up', up); speak(w.h); if (!heard.has(i)){ heard.add(i); render(); } });
    $('#hear').addEventListener('click', () => { speak(w.h); if (!heard.has(i)){ heard.add(i); render(); } });
    $('#memo').addEventListener('click', () => { if (!heard.has(i) || memo.has(i)) return; memo.add(i); render(); });
    $('#prev').addEventListener('click', () => { i--; up = false; render(); });
    if ($('#next')) $('#next').addEventListener('click', () => { if (!okAt(i)) return; i++; up = false; render(); });
    if ($('#toCheck')) $('#toCheck').addEventListener('click', () => finishAct('vocab_learn', 0, {
      secs: Math.round((Date.now() - t0) / 1000), again: vocabLearn, title: '🎴 카드로 익히기', game: { key:'card', name:'카드로 익히기' },
      detail: '<div class="row center" style="margin-top:14px"><button class="btn" id="hubL">어휘 학습 메뉴</button><button class="btn red" id="goCheck">다음: 뜻 보고 고르기 ▶</button></div>',
      after: () => { $('#hubL').addEventListener('click', learnHub); $('#goCheck').addEventListener('click', () => vocabCheck()); }
    }));
  }
  render();
}
/* 어휘 학습 메뉴: 처음에는 카드로 익히기 → 끝나면 뜻 보고 고르기가 열림. 둘 다 끝내면 언제든 골라서 다시 */
function learnHub(){
  const p = prog();
  show(`${backBar()}
    <div class="pagehead"><div><h1>어휘 학습</h1><div class="sub">처음에는 <b style="color:var(--gold)">카드로 익히기</b>를 먼저 해요. 두 활동을 모두 끝내면 언제든 골라서 다시 할 수 있어요.</div></div></div>
    <div class="games">${VLEARN.map((a, i) => {
      const open = i === 0 || learnDone(VLEARN[0].name);
      const n = p.lsub && p.lsub[a.name];

        <div class="ic">${a.icon}</div><div class="nm">${i + 1}. ${a.name}</div><div class="ds">${a.desc}</div>
        <div class="bs ${learnDone(a.name) ? '' : 'none'}">${!open ? '🔒 카드로 익히기를 먼저 끝내요' : learnDone(a.name) ? '✓ 완료' + (n ? ` · ${n}번` : '') : '아직 안 해 봤어요'}</div></button>`;
    }).join('')}</div>
    ${isDone('vocab_learn') && !isDone('vocab_game') ? '<div class="row center"><button class="btn red big" id="toNext">다음: 어휘 게임 ▶</button></div>' : ''}`);
  bindBack();

/* 2단계: 한국어 뜻을 보고 중국어 단어 고르기. 틀린 단어는 뒤에 다시 나와서, 모두 맞혀야 끝남 */
function vocabCheck(t0){
  t0 = t0 || Date.now();
  const all = D().words, pool = wordPool();
  const queue = shuffle(all), total = all.length, missed = [];
  let firstRight = 0, cleared = 0;
  const wrongOnce = new Set();
  function draw(){
    const w = queue[0];
    const others = shuffle(pool.filter(x => key(x.h) !== key(w.h) && key(x.k) !== key(w.k))).slice(0, 3);
    const opts = shuffle([w].concat(others));
    show(`${backBar('어휘 학습 메뉴')}
      <div class="qmeta"><div class="pagehead"><h1>🎯 뜻 보고 고르기</h1></div>
        <div class="gstat"><div><b>${cleared}/${total}</b><span>맞힌 단어</span></div></div></div>
      <div class="pbar"><span style="width:${cleared / total * 100}%"></span></div>
      <div class="paper qcard"><div class="ask">이 뜻에 맞는 중국어는?</div><div class="ko">${esc(w.k)}</div></div>
      <div class="opts">${opts.map((o, n) => `<button class="tile k-hz" type="button" data-n="${n}">${zp(o.h, o.p)}</button>`).join('')}</div>
      <div id="fb"></div>`);
    bindBack(learnHub);
    $$('.opts .tile').forEach(b => b.addEventListener('click', () => {
      const ok = opts[+b.dataset.n] === w;
      $$('.opts .tile').forEach(x => { x.disabled = true; if (opts[+x.dataset.n] === w) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      speak(w.h);
      queue.shift();
      if (ok){
        cleared++;
        if (!wrongOnce.has(w)) firstRight++;
      } else {
        if (!wrongOnce.has(w)){ wrongOnce.add(w); missed.push(w); }
        /* 틀린 단어는 2~3문제 뒤에 다시 */
        queue.splice(Math.min(queue.length, 2 + Math.floor(Math.random() * 2)), 0, w);
      }
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '⭕ 정답!' : '❌ 정답은'} ${zp(w.h, w.p)} · ${esc(w.k)}${ok ? '' : ' <span style="font-size:14px">(조금 뒤에 다시 나와요)</span>'}</div>
        <button class="btn red big block" id="nx" style="margin-top:12px">${queue.length ? '다음 ▶' : '어휘 학습 완료'}</button>`;
      $('#nx').addEventListener('click', () => {
        if (queue.length) return draw();
        finishAct('vocab_learn', 0, {
          secs: Math.round((Date.now() - t0) / 1000), again: () => vocabCheck(), title: '🎯 뜻 보고 고르기', game: { key:'check', name:'뜻 보고 고르기' },
          detail: `<p class="result-sub" style="margin-top:10px">한 번에 맞힌 단어 ${firstRight} / ${total}</p><div class="row center" style="margin-top:12px"><button class="btn" id="hubL">어휘 학습 메뉴</button></div>`,
          after: () => $('#hubL').addEventListener('click', learnHub),
          review: wordReview(missed, '헷갈렸던 단어')
        });
      });
    }));
  }
  draw();
}

/* ======================== ② 어휘 게임 ======================== */
/* 게임을 더 넣을 때는 이 목록에 한 줄 추가 → 합계 만점이 자동으로 늘어나요 */
const VGAMES = [

  { key:'memory', icon:'🃏', name:'카드 뒤집기', desc:'카드 두 장을 뒤집어 단어와 뜻의 짝을 찾아요', fn: gMemory },
  { key:'listen', icon:'👂', name:'듣고 고르기', desc:'소리를 듣고 알맞은 단어를 골라요', fn: gListen },

  { key:'mole',   icon:'🔨', name:'두더지 잡기', desc:'알맞은 말을 들고 나온 두더지만 톡! 잡아요', fn: gMole }
];
function gameHub(){

    <div class="pagehead"><div><h1>어휘 게임</h1><div class="sub">게임마다 <b style="color:var(--gold)">최고 점수</b>가 기록되고, 모든 게임 점수를 더한 것이 어휘 게임 점수예요. <b style="color:var(--gold)">모든 게임을 한 번씩 끝내야</b> 다음 단계가 열려요.</div></div>
    <div class="score-pill" style="color:var(--gold)">${p.scores.vocab_game || 0}<small style="color:var(--muted)"> / ${VG_MAX()}점</small></div></div>

function gameHead(title, stats){
  return `${backBar('게임 고르기')}<div class="qmeta"><div class="pagehead"><h1>${title}</h1></div><div class="gstat">${stats}</div></div>`;
}
const wordPool = () => uniqBy(uniqBy(D().words, w => w.h), w => w.k);

/* 짝 맞추기 */
function gMatch(){
  const words = shuffle(wordPool()).slice(0, 6);
  const left = shuffle(words.map((w, i) => i)), right = shuffle(words.map((w, i) => i));
  let sel = null, miss = 0, found = 0, t0 = 0; const done = new Set(), wrong = [];
  show(`${gameHead('🀄 짝 맞추기', `<div><b id="gLeft">${words.length}</b><span>남은 짝</span></div><div><b id="gMiss">0</b><span>실수</span></div>`)}
    <p class="label">단어 하나, 뜻 하나를 차례로 눌러 짝을 맞춰요</p>
    <div class="match"><div class="col">${left.map(i => `<button class="tile k-hz" type="button" data-s="L" data-i="${i}">${zp(words[i].h, words[i].p)}</button>`).join('')}</div>
    <div class="col">${right.map(i => `<button class="tile k-ko" type="button" data-s="R" data-i="${i}">${esc(words[i].k)}</button>`).join('')}</div></div>`);
  bindBack(gameHub);
  $$('.match .tile').forEach(b => b.addEventListener('click', () => {
    if (!t0) t0 = Date.now();
    const side = b.dataset.s, i = +b.dataset.i;
    if (done.has(i)) return;
    if (side === 'L') speak(words[i].h);
    if (!sel || sel.side === side){
      $$('.match .tile.sel').forEach(x => x.classList.remove('sel'));
      sel = { side, i, el: b }; b.classList.add('sel'); return;
    }
    if (sel.i === i){
      done.add(i); found++;
      [sel.el, b].forEach(x => { x.classList.remove('sel'); x.classList.add('ok', 'gone'); x.disabled = true; });
      $('#gLeft').textContent = words.length - found;
      sel = null;
      if (found === words.length){
        const score = Math.round(100 * words.length / (words.length + miss));
        setTimeout(() => gameDone('match', score, Math.round((Date.now() - t0) / 1000), wordReview(wrong)), 500);
      }
    } else {
      miss++; $('#gMiss').textContent = miss;
      wrong.push(words[sel.side === 'L' ? sel.i : i]);
      [sel.el, b].forEach(x => { x.classList.remove('sel', 'shake'); void x.offsetWidth; x.classList.add('shake'); });
      sel = null;
    }
  }));
}

/* 카드 뒤집기 */
function gMemory(){
  const PREVIEW = 5, MOVE = 4;   /* 미리 보는 시간(초), 자리를 바꿀 카드 수 */
  const words = shuffle(wordPool()).slice(0, 6);
  const cards = shuffle(words.flatMap((w, i) => [{ w:i, kind:'hz' }, { w:i, kind:'ko' }]));
  let open = [], lock = true, found = 0, miss = 0, t0 = 0, timers = []; const wrong = [];
  show(`${gameHead('🃏 카드 뒤집기', `<div><b id="gLeft">${words.length}</b><span>남은 짝</span></div><div><b id="gMiss">0</b><span>실패</span></div>`)}
    <p class="label go" id="memMsg" style="font-size:18px">카드를 잘 기억해 두세요! <b id="cd">${PREVIEW}</b>초 뒤에 뒤집혀요</p>
    <div class="mem" id="mem">${cards.map((c, n) => `<button class="mc up k-${c.kind}" type="button" data-n="${n}" aria-label="카드 ${n + 1}"><span class="in">
      <span class="sd bk" aria-hidden="true">${c.kind === 'ko' ? '韩' : '中'}</span>
      <span class="sd fr">${c.kind === 'hz' ? zp(words[c.w].h, words[c.w].p) : esc(words[c.w].k)}</span></span></button>`).join('')}</div>`);
  bindBack(gameHub);
  S.cleanup.push(() => timers.forEach(t => { clearTimeout(t); clearInterval(t); }));
  const later = (f, ms) => { const t = setTimeout(f, ms); timers.push(t); return t; };
  /* 1) 미리 보기 */
  let left = PREVIEW;
  const iv = setInterval(() => {
    left--; const cd = $('#cd'); if (cd) cd.textContent = left;
    if (left > 0) return;
    clearInterval(iv);
    $$('.mc').forEach(el => el.classList.remove('up'));
    $('#memMsg').textContent = '카드를 섞는 중…';
    later(shuffleSome, 650);
  }, 1000);
  timers.push(iv);
  /* 2) 카드 몇 장만 자리 바꾸기 (움직이는 모습이 보이게) */
  function shuffleSome(){
    const grid = $('#mem'); if (!grid) return;
    const els = $$('.mc', grid);
    const k = Math.min(MOVE, els.length);
    const picked = shuffle(els.map((_, i) => i)).slice(0, k);
    let target = shuffle(picked);
    for (let t = 0; t < 10 && target.some((x, j) => x === picked[j]); t++) target = shuffle(picked);
    const order = els.slice();
    picked.forEach((from, j) => { order[target[j]] = els[from]; });
    const before = new Map(els.map(el => [el, el.getBoundingClientRect()]));
    order.forEach(el => grid.appendChild(el));
    order.forEach(el => {
      const a = before.get(el), b = el.getBoundingClientRect();
      const dx = a.left - b.left, dy = a.top - b.top;
      if (!dx && !dy) return;
      el.classList.add('moved');
      el.style.transition = 'none';
      el.style.transform = `translate(${dx}px,${dy}px)`;
      void el.offsetWidth;
      el.style.transition = 'transform .7s ease';
      el.style.transform = '';
    });
    later(() => {
      $$('.mc.moved').forEach(el => { el.classList.remove('moved'); el.style.transition = ''; });
      const m = $('#memMsg'); if (m) m.textContent = `카드 ${k}장이 자리를 바꿨어요! 이제 짝을 찾아 뒤집어요`;
      lock = false;
    }, 900);
  }
  /* 3) 짝 찾기 */
  $$('.mc').forEach(el => el.addEventListener('click', () => {
    const c = cards[+el.dataset.n];
    if (lock || c.up || c.done) return;
    if (!t0) t0 = Date.now();
    c.up = true; el.classList.add('up');
    if (c.kind === 'hz') speak(words[c.w].h);
    open.push({ c, el });
    if (open.length < 2) return;
    const [a, b] = open; open = [];
    if (a.c.w === b.c.w){
      a.c.done = b.c.done = true; found++;
      $('#gLeft').textContent = words.length - found;
      later(() => [a, b].forEach(x => x.el.classList.add('done')), 350);
      if (found === words.length){
        const score = Math.max(40, 100 - 5 * Math.max(0, miss - 2));
        later(() => gameDone('memory', score, Math.round((Date.now() - t0) / 1000), wordReview(wrong)), 900);
      }
    } else {
      miss++; lock = true; $('#gMiss').textContent = miss;
      wrong.push(words[a.c.w]);
      later(() => [a, b].forEach(x => x.el.classList.add('miss')), 380);
      later(() => { [a, b].forEach(x => { x.c.up = false; x.el.classList.remove('up', 'miss'); }); lock = false; }, 1150);
    }
  }));
}

/* 듣고 고르기 */
function gListen(){
  const pool = wordPool(), qs = shuffle(pool).slice(0, Math.min(8, pool.length));
  let i = 0, right = 0; const t0 = Date.now(), wrong = [];
  function draw(){
    const w = qs[i], opts = shuffle([w].concat(pickOthers(w.h, pool.map(x => x.h), 3).map(h => pool.find(x => x.h === h))));
    show(`${gameHead('👂 듣고 고르기', `<div><b>${i + 1}/${qs.length}</b><span>문제</span></div><div><b>${right}</b><span>정답</span></div>`)}

/* 문제 만들기 (판다 달리기·두더지 잡기 공용): 반은 '단어 → 뜻', 반은 '뜻 → 단어' */
function makeWordQs(n, k){
  const pool = wordPool();
  return shuffle(pool).slice(0, Math.min(n, pool.length)).map((w, i) => {
    const toKo = i % 2 === 0;
    const others = shuffle(pool.filter(x => key(x.h) !== key(w.h) && key(x.k) !== key(w.k))).slice(0, Math.min(k, pool.length) - 1);
    return { w, toKo, opts: shuffle([w].concat(others)) };
  }).sort(() => Math.random() - 0.5);
}
const promptHtml = q => q.toKo
  ? `<div class="gp-ask">이 단어의 뜻은?</div><div class="gp-word">${zp(q.w.h, q.w.p)}</div>`
  : `<div class="gp-ask">이 뜻에 맞는 중국어는?</div><div class="gp-ko">${esc(q.w.k)}</div>`;
const optHtml = (q, o) => q.toKo ? `<span class="ok-ko">${esc(o.k)}</span>` : zp(o.h, o.p);

function gMole(){
  const TN = 10, qs = makeWordQs(TN, 4);

  let qi = 0, hits = 0, bad = 0, letGo = 0, timers = [], since = 0, t0 = Date.now(), up = 1400;
  const wrong = [], holes = new Array(9).fill(null);
  show(`${gameHead('🔨 두더지 잡기', `<div><b id="mN">0/${qs.length}</b><span>잡은 수</span></div><div><b id="mBad">0</b><span>헛방</span></div>`)}

      <span class="sign"></span><span class="mface"><i class="e1"></i><i class="e2"></i><i class="nose"></i></span></button><span class="dirt"></span></div>`).join('')}</div>`);
  bindBack(gameHub);
  const later = (f, ms) => { const t = setTimeout(f, ms); timers.push(t); return t; };
  S.cleanup.push(() => timers.forEach(clearTimeout));
  function setQ(){
    if (qi >= qs.length) return end();
    $('#mPrompt').innerHTML = promptHtml(qs[qi]);
    since = 0;
  }
  function popOne(){
    if (qi >= qs.length || !$('#moles')) return;
    const q = qs[qi];
    const free = holes.map((h, i) => h ? -1 : i).filter(i => i >= 0);
    if (free.length){
      const hi = free[Math.floor(Math.random() * free.length)];
      const isTarget = since >= 2 || Math.random() < 0.4;
      const o = isTarget ? q.w : shuffle(q.opts.filter(x => x !== q.w))[0] || q.w;
      since = o === q.w ? 0 : since + 1;
      const el = $(`.mole[data-h="${hi}"]`);
      el.querySelector('.sign').innerHTML = optHtml(q, o);
      el.className = 'mole up';
      const tok = { o, qi, hit:false };
      holes[hi] = tok;
      later(() => {
        if (holes[hi] !== tok) return;
        holes[hi] = null; el.className = 'mole';
        if (!tok.hit && tok.qi === qi && o === q.w){ letGo++; }
      }, up + Math.random() * 500);
    }
    later(popOne, 520 + Math.random() * 380);
  }
  $$('.mole').forEach(el => el.addEventListener('pointerdown', e => {
    e.preventDefault();
    const hi = +el.dataset.h, tok = holes[hi];
    if (!tok || tok.hit) return;
    tok.hit = true;
    const q = qs[qi];
    if (tok.qi === qi && tok.o === q.w){
      el.className = 'mole up bonk';
      speak(q.w.h);
      hits++; qi++; $('#mN').textContent = hits + '/' + qs.length;
      up = Math.max(1000, up - 40);
      later(() => { if (holes[hi] === tok){ holes[hi] = null; el.className = 'mole'; } }, 350);
      /* 다른 두더지는 모두 들어가고 다음 문제 */
      holes.forEach((t, i) => { if (t && i !== hi){ holes[i] = null; $(`.mole[data-h="${i}"]`).className = 'mole'; } });
      setQ();
    } else {
      el.className = 'mole up miss';
      bad++; $('#mBad').textContent = bad;
      if (wrong.indexOf(q.w) < 0) wrong.push(q.w);
      later(() => { if (holes[hi] === tok){ holes[hi] = null; el.className = 'mole'; } }, 400);
    }
  }));
  function end(){
    timers.forEach(clearTimeout);
    const score = Math.round(100 * qs.length / (qs.length + bad + letGo * 0.5));
    gameDone('mole', score, Math.round((Date.now() - t0) / 1000), wordReview(wrong));
  }
  setQ();
  later(popOne, 500);
}

/* ======================== ③ 문장 학습: 문장 카드 고르기 → 녹음 → 발음 평가 ======================== */
const SENT_PASS = 80;   /* 모든 문장 점수 평균이 이 점수 이상이면 문장 학습 완료 */
const REC = {
  stream:null, mode:null, ctx:null, stopReq:false,
  /* 누르는 순간(사용자 동작 안에서) 오디오를 깨워 둔다 — 아이패드 사파리용 */
  prime(){
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!this.ctx && AC) this.ctx = new AC();
      if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
    } catch(e){}
  },
  async init(){
    if (this.mode === 'mic' && this.stream && this.stream.getTracks().some(t => t.readyState === 'live')) return 'mic';
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error('no api');
      this.stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true } });
      this.mode = 'mic';
    } catch(e){ this.mode = 'fake'; }
    return this.mode;
  },
  mime(){
    const c = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (const m of c){ try { if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) return m; } catch(e){} }
    return '';
  },
  dispose(){
    if (this.stream) this.stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} });
    this.stream = null; if (this.mode === 'mic') this.mode = null;
  },
  stop(){ this.stopReq = true; },
  /* 녹음 + 목소리 크기 + 음높이(성조 분석용). 다 읽고 잠시 조용하면 자동으로 끝남 */
  async record(o){
    this.stopReq = false;
    const ctx = this.ctx; let an = null, src = null, fbuf = null, bbuf = null;
    if (ctx){
      try {
        if (ctx.state === 'suspended') await ctx.resume();
        src = ctx.createMediaStreamSource(this.stream); an = ctx.createAnalyser(); an.fftSize = 2048;
        src.connect(an);
        if (an.getFloatTimeDomainData) fbuf = new Float32Array(an.fftSize); else bbuf = new Uint8Array(an.fftSize);
      } catch(e){ an = null; }
    }
    const type = this.mime();
    let mr;
    try { mr = type ? new MediaRecorder(this.stream, { mimeType:type }) : new MediaRecorder(this.stream); }
    catch(e){ mr = new MediaRecorder(this.stream); }
    const chunks = [], frames = [];
    mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
    const stopped = new Promise(res => { mr.onstop = res; });
    mr.start(250);
    const t0 = performance.now(), sr = ctx ? ctx.sampleRate : 44100;
    let last = t0, voiced = 0, lastVoice = 0, peak = 0;
    await new Promise(res => {
      const tick = () => {
        const now = performance.now(), dt = Math.min(200, now - last); last = now;
        let lvl = 0;
        if (an){
          if (fbuf){ an.getFloatTimeDomainData(fbuf); let s = 0; for (let k = 0; k < fbuf.length; k++) s += fbuf[k] * fbuf[k]; lvl = Math.sqrt(s / fbuf.length); }
          else { an.getByteTimeDomainData(bbuf); let s = 0; for (let k = 0; k < bbuf.length; k++){ const v = (bbuf[k] - 128) / 128; s += v * v; } lvl = Math.sqrt(s / bbuf.length); }
        }
        peak = Math.max(peak, lvl);
        if (lvl > 0.03){ voiced += dt; lastVoice = now; }
        const el = now - t0;
        if (fbuf && lvl > 0.02) frames.push({ t: el, f0: f0Of(fbuf, sr) });
        if (o.onLevel) o.onLevel(Math.min(1, lvl * 7), Math.min(1, el / o.maxMs), voiced >= o.minVoice);
        if (this.stopReq || el >= o.maxMs || (voiced >= o.minVoice && now - lastVoice > 1300)) return res();
        setTimeout(tick, 40);
      };
      tick();
    });
    const elapsed = performance.now() - t0;
    try { mr.stop(); } catch(e){}
    await Promise.race([stopped, new Promise(r => setTimeout(r, 2000))]);
    try { src && src.disconnect(); } catch(e){}
    const blob = new Blob(chunks, { type:(mr.mimeType || type || 'audio/webm') });
    const meterOk = an && peak > 0;   /* 소리 크기를 잴 수 없는 기기면 녹음 길이로만 판단 */
    const ok = meterOk ? voiced >= o.minVoice : (elapsed > 1500 && blob.size > 1500);
    return { ok, blob, mime: blob.type, frames: frames.filter(f => f.f0 > 0) };
  }
};
/* 저장하지 못한 문장 점수 보관함 (학생별, 이 기기에만) */
const pendKey = () => 'cw-pend-' + (S.me ? S.me.sid : '');
function pendGet(){ return LS.get(pendKey()) || []; }
function pendPut(it){
  const L = pendGet(), i = L.findIndex(x => x.unit === it.unit && x.idx === it.idx && x.text === it.text);
  if (i < 0) L.push(it);
  else if (!it.skip && (L[i].skip || (it.score || 0) > (L[i].score || 0))) L[i] = it;   /* 더 높은 점수만 남김 */
  LS.set(pendKey(), L);
}
function pendDrop(it){ LS.set(pendKey(), pendGet().filter(x => !(x.unit === it.unit && x.idx === it.idx && x.text === it.text))); }
function blobToB64(blob){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
}

/* ---------- 음높이 (자기상관) ---------- */
function f0Of(buf, sr){
  const minLag = Math.floor(sr / 450), maxLag = Math.floor(sr / 70), N = buf.length - maxLag;
  if (N < 200) return 0;
  const C = new Float32Array(maxLag + 2);
  let best = 0;
  for (let lag = minLag; lag <= maxLag + 1; lag++){
    let s = 0, e1 = 0, e2 = 0;
    for (let i = 0; i < N; i += 2){ const a = buf[i], b = buf[i + lag]; s += a * b; e1 += a * a; e2 += b * b; }
    C[lag] = s / Math.sqrt(e1 * e2 + 1e-12);
    if (C[lag] > best) best = C[lag];
  }
  if (best < 0.6) return 0;
  /* 한 옥타브 낮게 잘못 읽지 않도록: 가장 높은 값에 가까운 '첫 번째' 봉우리를 고름 */
  for (let lag = minLag + 1; lag <= maxLag; lag++){
    if (C[lag] >= best * 0.9 && C[lag] >= C[lag - 1] && C[lag] >= C[lag + 1]) return sr / lag;
  }
  return 0;
}

/* ---------- 병음 나누기: 성모·운모·성조 ---------- */
const TONE_OF = {};
[['a','āáǎà'],['e','ēéěè'],['i','īíǐì'],['o','ōóǒò'],['u','ūúǔù'],['v','ǖǘǚǜ']].forEach(([b, s]) =>
  [...s].forEach((c, i) => { TONE_OF[c] = i + 1; TONE_OF[c.toUpperCase()] = i + 1; }));
const INITS = ['zh','ch','sh','b','p','m','f','d','t','n','l','g','k','h','j','q','x','r','z','c','s','y','w'];
function sylParts(syl){
  syl = String(syl || '').trim();
  let tone = 5, base = '';
  for (const ch of syl){
    if (TONE_OF[ch]){ tone = TONE_OF[ch]; base += MARK[ch]; continue; }
    const low = ch.toLowerCase();
    if (low === 'ü') base += 'v'; else if (/[a-z]/.test(low)) base += low;
  }
  const ini = INITS.find(x => base.startsWith(x) && base.length > x.length) || '';
  let fin = base.slice(ini.length);
  if (/^[jqxy]$/.test(ini) && fin[0] === 'u') fin = 'v' + fin.slice(1);   /* ju·qu·xu·yu 의 u 는 ü */
  return { syl, base, ini, fin, tone };
}
const SIM_INI = [['zh','z'],['ch','c'],['sh','s'],['n','l'],['f','h'],['r','l'],['j','zh'],['q','ch'],['x','sh']];
const SIM_FIN = [['en','eng'],['in','ing'],['an','ang'],['ian','iang'],['uan','uang'],['un','ong'],['ou','uo'],['e','o']];
const simPair = (L, a, b) => L.some(([x, y]) => (a === x && b === y) || (a === y && b === x));
const partScore = (L, a, b) => a === b ? 100 : simPair(L, a, b) ? 50 : 0;
const pyArr = text => { try { return window.pinyinPro ? pinyinPro.pinyin(text, { type:'array' }) : null; } catch(e){ return null; } };

/* 문장의 글자마다 기대하는 병음 (선생님이 적은 병음 → 없으면 사전) */
function targetChars(s){

/* 목소리 음높이를 글자마다 나누기: 소리가 끊기는 곳(자음·쉼)으로 음절을 찾고, 글자 수에 맞춰 합치거나 나눔 */

      ${showSkip ? '<div class="row center"><button class="btn small" type="button" id="skip">녹음·평가가 안 돼요 → 이 문장 건너뛰기 (선생님이 확인해요)</button></div>' : ''}
      <div class="row center">
        <button class="btn big" type="button" id="toList">◀ 문장 목록</button>
        ${k < list.length - 1 ? '<button class="btn red big" type="button" id="nextS">다음 문장 ▶</button>' : ''}
      </div>`;
    $('#fc').addEventListener('click', () => { if (busyRec) return; $('#fc').classList.toggle('up'); speak(s.zh, RATE.sent); });
    if ($('#play')) $('#play').addEventListener('click', () => { stopSpeak(); new Audio(mine[k].url).play().catch(() => {}); });
    $('#recBtn').addEventListener('click', () => record(k));
    $('#toList').addEventListener('click', renderList);
    if ($('#nextS')) $('#nextS').addEventListener('click', () => renderDetail(k + 1));
    if ($('#skip')) $('#skip').addEventListener('click', () => skip(k));
    if ($('#resave')) $('#resave').addEventListener('click', () => saveScore(k, local[k] || { total: (pendOf(k) || {}).score || 0, heard:'' }));
  }
  async function saveScore(k, ev){
    ev.saving = true; ev.saveErr = '';
    if (view === 'detail' && cur === k) renderDetail(k);
    const item = { unit:S.unit, idx:k + 1, text:list[k].zh, score:ev.total, heard:ev.heard };
    try {
      const r = await call('saveSentenceScore', Object.assign({ sid:S.me.sid, name:S.me.name }, item));
      P().sent = r.sent || P().sent;
      pendDrop(item);
      flushPend();
    } catch(e){
      ev.saveErr = errText(e);
      pendPut(item);
      if (/알 수 없는 요청/.test(ev.saveErr)) verWarn('');
    }
    ev.saving = false;
    if (view === 'detail' && cur === k) renderDetail(k);
    else if (view === 'list') renderList();
  }
  /* 보관해 둔 점수를 차례로 다시 보냄 */
  let flushing = false;
  async function flushPend(){
    if (flushing) return;
    flushing = true;
    for (const q of pend()){
      try {
        const r = await call('saveSentenceScore', Object.assign({ sid:S.me.sid, name:S.me.name }, q));
        if (q.unit === S.unit) P().sent = r.sent || P().sent;
        pendDrop(q);
      } catch(e){ break; }
    }
    flushing = false;
    if (view === 'list' && $('.slist')) renderList();
  }
  async function skip(k){
    if (!confirm('이 문장을 건너뛸까요?\n선생님이 녹음기록에서 "확인 필요"로 보게 돼요.')) return;
    busy(true, '저장하는 중…');
    try {
      const r = await call('saveSentenceScore', { sid:S.me.sid, name:S.me.name, unit:S.unit, idx:k + 1, text:list[k].zh, skip:true });
      P().sent = r.sent || P().sent;
    } catch(e){ busy(false); alert('저장하지 못했어요. ' + errText(e)); return; }
    busy(false);
    if (!$('#slot')) return;
    if (k < list.length - 1) renderDetail(k + 1); else renderList();
  }
  function upload(k, rec){
    if (!rec || !rec.blob || rec.blob.size < 1000) return;
    blobToB64(rec.blob).then(data => {
      if (data.length > 6 * 1024 * 1024) return;
      return call('saveAudio', { sid:S.me.sid, name:S.me.name, unit:S.unit, act:'sent_learn', idx:k + 1, text:list[k].zh, mime:rec.mime, data });
    }).catch(() => {});
  }
  async function record(k){
    if (busyRec) return;
    busyRec = true; stopSpeak();
    REC.prime();   /* 누른 순간에 오디오 깨우기 (아이패드) */
    const s = list[k], n = Array.from(s.zh).filter(isHan).length || 4;
    const minVoice = Math.min(1800, Math.max(500, n * 120)), maxMs = Math.min(16000, Math.max(5000, n * 700 + 3000));
    lockAll(true);
    const rp = $('#rp');
    rp.innerHTML = '<div class="rec-panel"><span>🎤 마이크를 준비하는 중… 허용 창이 뜨면 [허용]을 눌러요</span></div>';
    const mode = recOnly ? 'none' : await REC.init();
    let rec = null, res = { err:null, texts:[] };
    const L = SRC ? listen() : null;
    rp.innerHTML = `<div class="rec-panel"><span class="rec-dot"></span><b>말해 보세요!</b>
      <div class="meter" title="목소리 크기"><span id="lv"></span></div>
      <button class="btn small" type="button" id="stopRec" style="color:var(--ink);background:#fff">다 읽었어요</button></div>
      <div class="meter time" style="margin-top:6px;height:6px"><span id="tm"></span></div>`;
    let stopNow = false;
    $('#stopRec').disabled = false;
    $('#stopRec').addEventListener('click', () => { stopNow = true; REC.stop(); });
    try {
      if (mode === 'mic'){
        rec = await REC.record({ minVoice, maxMs, onLevel: (lv, t, enough) => {
          const a = $('#lv'), b = $('#tm'); if (a){ a.style.width = (lv * 100) + '%'; a.style.background = enough ? 'var(--ok)' : 'var(--red)'; } if (b) b.style.width = (t * 100) + '%';
        } });
      } else if (L){
        /* 녹음기를 못 쓰는 기기: 음성 인식만으로 (다 읽고 1.5초 조용하면 끝) */
        const t1 = performance.now();
        await new Promise(done => { const iv = setInterval(() => {
          const el = performance.now() - t1, b = $('#tm'), a = $('#lv');
          if (b) b.style.width = Math.min(100, el / maxMs * 100) + '%';
          if (a) a.style.width = L.heardSome() ? '60%' : '10%';
          if (stopNow || el > maxMs || L.isEnded() || (L.heardSome() && L.idleFor() > 1500)){ clearInterval(iv); done(); }
        }, 100); S.cleanup.push(() => { clearInterval(iv); done(); }); });
      }
      if (L){ L.stop(); res = await L.result(); }
    } catch(e){ res = { err:'record', texts:[] }; }
    busyRec = false;
    if (!$('#rp') || view !== 'detail' || cur !== k) return;   /* 화면을 떠난 경우 */
    if (rec && rec.blob && rec.blob.size > 1000){
      if (mine[k]) try { URL.revokeObjectURL(mine[k].url); } catch(e){}
      mine[k] = { url: URL.createObjectURL(rec.blob) };
    }
    /* 기기·연결 문제: 평가하지 않음 */
    if (!SRC || (res.err && TECH_ERR.indexOf(res.err) >= 0 && !res.texts.length) || (mode !== 'mic' && !L)){
      techFails++;
      if (res.err === 'audio-capture' && mode === 'mic'){ recOnly = true; REC.dispose(); }
      upload(k, rec);
      renderDetail(k);
      $('#rp').innerHTML = `<div class="fb no" style="justify-content:center">${!SRC ? '이 브라우저는 발음 평가를 할 수 없어요. 사파리나 크롬으로 열어 주세요.'
        : res.err === 'not-allowed' || res.err === 'service-not-allowed' ? '마이크·음성 인식을 허용해 주세요. 주소창의 설정에서 허용한 뒤 다시 눌러요.'
        : res.err === 'network' ? '음성 인식 서버에 연결하지 못했어요. 인터넷을 확인하고 다시 눌러요.'
        : '발음 평가가 잘 되지 않았어요. 한 번 더 눌러 주세요.'}${techFails >= 2 ? '<br>계속 안 되면 아래 [건너뛰기]를 눌러요.' : ''}</div>`;
      return;
    }
    techFails = 0;
    if (!res.texts.length && rec && !rec.ok){
      renderDetail(k);
      $('#rp').innerHTML = '<div class="fb no" style="justify-content:center">목소리가 잘 들리지 않았어요. 조금 더 크게, 문장을 끝까지 읽어 주세요.</div>';
      return;
    }
    const ev = scoreSentence(s, res.texts, rec ? rec.frames : null);
    local[k] = ev;
    upload(k, rec);
    renderDetail(k);
    $('#rp').innerHTML = '<span class="label">점수를 저장하는 중…</span>';
    await saveScore(k, ev);
  }
  renderList();
}

/* ======================== ④ 문장 게임: 빈칸 채우기 → 어순 배열 ======================== */
function sentGame(){
  const all = D().sentences.filter(s => s.pieces.length >= 2);
  if (!all.length){ show(`${backBar()}<div class="paper">문장 게임에 쓸 문장이 없어요. 선생님께 말씀해 주세요.</div>`); bindBack(); return; }
  const set = shuffle(all).slice(0, 6), t0 = Date.now();
  const piecePool = uniqBy(all.flatMap(s => s.pieces).concat(D().words.map(w => w.h)), x => x);
  let A = 0, B = 0, i = 0;
  const wrongA = [], wrongB = [];

  /* 1단계: 빈칸 채우기 */
  function blankQ(){
    const s = set[i];
    const pi = Math.floor(Math.random() * s.pieces.length);
    const ans = { h: s.pieces[pi], p: s.ppy[pi] };
    const inSent = new Set(s.pieces.map(key));
    const cand = uniqBy((s.decoys || []).concat(shuffle(piecePool)).filter(x => !inSent.has(key(x))), x => x).slice(0, 3);
    const opts = shuffle([ans].concat(cand.map(h => ({ h, p: pyOf(h) }))));
    let tried = false, solved = false;
    function draw(){
      show(`${backBar()}
        <div class="qmeta"><div class="pagehead"><h1>문장 게임 <span class="on-felt-muted" style="font-size:18px">1단계 빈칸 채우기</span></h1></div><div class="gstat"><div><b>${i + 1}/${set.length}</b><span>문제</span></div></div></div>
        <div class="paper qcard"><div class="ask">뜻: <b style="color:var(--blue)">${esc(s.ko)}</b></div>
          <div class="sent">${sentHtml(s, pi, solved)}</div></div>
        <div class="opts">${opts.map((o, n) => `<button class="tile k-hz" type="button" data-n="${n}">${zp(o.h, o.p)}</button>`).join('')}</div>
        <div id="fb"></div>`);
      bindBack();
      $$('.opts .tile').forEach(b => b.addEventListener('click', () => {
        if (solved) return;
        if (opts[+b.dataset.n] === ans){
          solved = true; if (!tried) A++; else wrongA.push(s);
          draw();
          $$('.opts .tile').forEach(x => { x.disabled = true; if (opts[+x.dataset.n] === ans) x.classList.add('ok'); });
          speak(s.zh, RATE.sent);
          $('#fb').innerHTML = `<div class="fb ${tried ? 'no' : 'ok'}">${tried ? '이번엔 찾았어요!' : '⭕ 정답!'} ${sayBtn(s.zh, '🔊', RATE.sent)}</div>
            <button class="btn red big block" id="nx" style="margin-top:12px">${i < set.length - 1 ? '다음 문제 ▶' : '2단계로 ▶'}</button>`;
          $('#nx').addEventListener('click', () => { i++; if (i < set.length) blankQ(); else { i = 0; between(); } });
        } else {
          tried = true; b.classList.add('ng', 'shake'); b.disabled = true;
          $('#fb').innerHTML = '<div class="fb no">다시 골라 보세요.</div>';
        }
      }));
    }
    draw();
  }
  function between(){
    show(`<div class="paper center"><h2>1단계 끝!</h2><div class="result-big" style="font-size:48px">${A} / ${set.length}</div>
      <p class="result-sub">한 번에 맞힌 빈칸</p><p class="muted">이제 2단계 어순 배열이에요. 카드를 눌러 순서대로 놓아요.</p>
      <button class="btn red big" id="go">2단계 시작 ▶</button></div>`);
    $('#go').addEventListener('click', orderQ);
  }
  /* 2단계: 어순 배열 (눌러서 놓기) */
  function orderQ(){
    const s = set[i];
    const used = new Set(s.pieces.map(key));
    let decoys = uniqBy((s.decoys || []).filter(x => !used.has(key(x))), x => x);
    if (!decoys.length) decoys = shuffle(piecePool.filter(x => !used.has(key(x)))).slice(0, 1);
    const cards = s.pieces.map((t, n) => ({ id:'p' + n, t, p: s.ppy[n] })).concat(decoys.map((t, n) => ({ id:'d' + n, t, p: pyOf(t), decoy:true })));
    let bank = shuffle(cards.map(c => c.id)), line = [], tried = false, solved = false, marks = {};
    const byId = id => cards.find(c => c.id === id);
    const pc = (id, cls) => `<button class="tile k-hz pc ${cls || ''}" type="button" data-id="${id}">${zp(byId(id).t, byId(id).p)}</button>`;
    function draw(msg){
      show(`${backBar()}
        <div class="qmeta"><div class="pagehead"><h1>문장 게임 <span class="on-felt-muted" style="font-size:18px">2단계 어순 배열</span></h1></div><div class="gstat"><div><b>${i + 1}/${set.length}</b><span>문제</span></div></div></div>
        <div class="paper qcard" style="padding:14px"><div class="ask">뜻</div><div class="ko">${esc(s.ko)}</div></div>
        <p class="label">눌러서 순서대로 놓아요 · 놓은 카드를 누르면 다시 돌아가요</p>
        <div class="line ${solved ? 'ok' : ''}" id="line">${line.length ? line.map(id => pc(id, marks[id])).join('') + `<span class="punct">${esc(tailPunct(s.zh))}</span>` : '<span class="ph">여기에 카드가 놓여요</span>'}</div>
        ${solved ? '' : `<div class="pool" id="pool">${bank.map(id => pc(id)).join('') || '<span class="ph" style="color:var(--muted)">카드를 다 썼어요</span>'}</div>
        <p class="label">문장에 쓰지 않는 카드도 섞여 있어요</p>`}
        <div id="fb">${msg || ''}</div>
        <div class="row center">${solved ? `<button class="btn red big" id="nx">${i < set.length - 1 ? '다음 문제 ▶' : '결과 보기'}</button>`
          : `<button class="btn big" id="reset">다시 놓기</button><button class="btn red big" id="chk" ${line.length ? '' : 'disabled'}>확인</button>`}</div>`);
      bindBack();
      if (solved){ $('#nx').addEventListener('click', () => { i++; if (i < set.length) orderQ(); else done(); }); return; }
      $$('#line .pc').forEach(b => b.addEventListener('click', () => { line = line.filter(x => x !== b.dataset.id); bank.push(b.dataset.id); marks = {}; draw(); }));
      $$('#pool .pc').forEach(b => b.addEventListener('click', () => { bank = bank.filter(x => x !== b.dataset.id); line.push(b.dataset.id); marks = {}; draw(); }));
      $('#reset').addEventListener('click', () => { bank = bank.concat(line); line = []; marks = {}; draw(); });
      $('#chk').addEventListener('click', () => {
        const got = line.map(id => byId(id).t);
        if (got.join('\u0001') === s.pieces.join('\u0001')){
          solved = true; if (!tried) B++; else wrongB.push(s);
          marks = {}; line.forEach(id => { marks[id] = 'ok'; });
          speak(s.zh, RATE.sent);
          draw(`<div class="fb ${tried ? 'no' : 'ok'}">${tried ? '이번엔 완성했어요!' : '⭕ 정답!'} ${sayBtn(s.zh, '🔊', RATE.sent)}</div>`);
        } else {
          tried = true; marks = {};
          line.forEach((id, n) => { marks[id] = (!byId(id).decoy && byId(id).t === s.pieces[n]) ? 'ok' : 'ng'; });
          const hasDecoy = line.some(id => byId(id).decoy), short = line.filter(id => !byId(id).decoy).length < s.pieces.length;
          draw(`<div class="fb no">${hasDecoy ? '필요 없는 카드가 들어 있어요. 빨간 카드를 빼 보세요.' : short ? '빠진 카드가 있어요.' : '순서가 달라요. 빨간 카드를 옮겨 보세요.'}</div>`);
        }
      });
    }
    draw();
  }
  function done(){
    const sa = Math.round(100 * A / set.length), sb = Math.round(100 * B / set.length), score = Math.round((sa + sb) / 2);
    finishAct('sent_game', score, {
      secs: Math.round((Date.now() - t0) / 1000), again: sentGame,
      detail: `<p class="result-sub" style="margin-top:10px">1단계 빈칸 ${sa}점 · 2단계 어순 ${sb}점의 평균</p>`,
      review: sentReview(wrongA.concat(wrongB))
    });
  }
  blankQ();
}

/* ======================== ⑤ 총정리 테스트 ======================== */
function finalTest(){
  const pool = wordPool(), sents = D().sentences.filter(s => s.pieces.length >= 2);
  /* meaning: 단어→뜻 / hanzi: 뜻→단어 / listen: 소리→단어 / listenKo: 소리→뜻 / blank: 문장 빈칸 */
  const types = ['meaning', 'meaning', 'hanzi', 'hanzi', 'listen', 'listen', 'listenKo', 'listenKo'];
  types.push(...(sents.length ? ['blank', 'blank'] : ['meaning', 'hanzi']));
  const ws = shuffle(pool);
  const wordOpts = w => shuffle([w].concat(pickOthers(w.h, pool.map(x => x.h), 3).map(h => pool.find(x => x.h === h))));
  const qs = shuffle(types).map((t, n) => {
    if (t === 'blank'){
      const s = shuffle(sents)[0], pi = Math.floor(Math.random() * s.pieces.length);
      const ans = { h: s.pieces[pi], p: s.ppy[pi] };
      const inSent = new Set(s.pieces.map(key));
      const pp = uniqBy((s.decoys || []).concat(shuffle(sents.flatMap(x => x.pieces)), shuffle(pool.map(w => w.h))).filter(x => !inSent.has(key(x))), x => x).slice(0, 3);
      return { t, s, pi, ans, opts: shuffle([ans].concat(pp.map(h => ({ h, p: pyOf(h) })))) };
    }
    const w = ws[n % ws.length];
    return { t, w, ans: w, opts: wordOpts(w) };
  });
  let i = 0, right = 0; const t0 = Date.now(), wrongW = [], wrongS = [];
  const ASK = { meaning:'이 단어의 뜻은?', hanzi:'이 뜻에 맞는 단어는?', listen:'소리를 듣고 알맞은 단어를 골라요', listenKo:'소리를 듣고 알맞은 뜻을 골라요', blank:'빈칸에 알맞은 말은?' };
  function draw(){
    const q = qs[i];
    let prompt = '';
    if (q.t === 'meaning') prompt = `<div class="big">${zp(q.w.h, q.w.p)}</div>`;
    if (q.t === 'hanzi') prompt = `<div class="ko">${esc(q.w.k)}</div>`;
    if (q.t === 'listen' || q.t === 'listenKo') prompt = `<div class="row center">${sayBtn(q.w.h, '🔊', RATE.word, 'bigsay')}${sayBtn(q.w.h, '🐢', RATE.slow, 'btn')}</div>`;
    if (q.t === 'blank') prompt = `<div class="sent">${sentHtml(q.s, q.pi, false)}</div><div class="muted" style="margin-top:8px">${esc(q.s.ko)}</div>`;
    const koOpts = q.t === 'meaning' || q.t === 'listenKo';
    show(`${backBar()}
      <div class="qmeta"><div class="pagehead"><h1>총정리 테스트</h1></div><div class="gstat"><div><b>${i + 1}/${qs.length}</b><span>문제</span></div></div></div>
      <div class="pbar"><span style="width:${i / qs.length * 100}%"></span></div>
      <div class="paper qcard"><div class="ask">${ASK[q.t]}</div>${prompt}</div>
      <div class="opts">${q.opts.map((o, n) => koOpts
        ? `<button class="tile k-ko" type="button" data-n="${n}">${esc(o.k)}</button>`
        : `<button class="tile k-hz" type="button" data-n="${n}">${zp(o.h, o.p)}</button>`).join('')}</div>
      <div id="fb"></div>`);
    bindBack();
    if (q.t === 'listen' || q.t === 'listenKo') speak(q.w.h);
    $$('.opts .tile').forEach(b => b.addEventListener('click', () => {
      const ok = q.opts[+b.dataset.n] === q.ans;
      if (ok) right++; else if (q.w) wrongW.push(q.w); else wrongS.push(q.s);
      $$('.opts .tile').forEach(x => { x.disabled = true; if (q.opts[+x.dataset.n] === q.ans) x.classList.add('ok'); });
      if (!ok) b.classList.add('ng');
      const info = q.w ? `${zp(q.w.h, q.w.p)} · ${esc(q.w.k)} ${sayBtn(q.w.h)}`
        : `<span class="zh" lang="zh-CN">${esc(q.s.zh)}</span> ${sayBtn(q.s.zh, '🔊', RATE.sent)}`;
      if (q.w && q.t !== 'listen' && q.t !== 'listenKo') speak(q.w.h);
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}">${ok ? '⭕ 정답!' : '❌ 정답:'} ${info}</div>
        <button class="btn red big block" id="nx" style="margin-top:12px">${i < qs.length - 1 ? '다음 문제 ▶' : '결과 보기'}</button>`;
      $('#nx').addEventListener('click', () => {
        i++;
        if (i < qs.length) return draw();
        finishAct('final_test', Math.round(100 * right / qs.length), {
          secs: Math.round((Date.now() - t0) / 1000), again: finalTest,
          detail: `<p class="result-sub" style="margin-top:10px">${qs.length}문제 중 ${right}문제 정답</p>`,
          review: wordReview(wrongW) + sentReview(wrongS)
        });
      });
    }));
  }
  draw();
}

/* ======================== 내 학습 기록 ======================== */
function myRecords(){
  busy(true, '기록을 불러오는 중…');
  call('login', S.me.sid, S.me.name).then(r => {
    busy(false);
    S.units = r.units || S.units; S.prog = r.progress || S.prog;
    drawRecords();
  }).catch(e => { busy(false); alert(errText(e)); });
}
function drawRecords(){
  const back = S.unit ? unitView : home;
  const allUnits = S.units.map(u => u.name);
  Object.keys(S.prog).forEach(u => { if (allUnits.indexOf(u) < 0) allUnits.push(u); });
  const grand = allUnits.reduce((a, u) => a + unitTotal(u), 0);
  const cell = (v, max) => v == null ? '<span class="muted">-</span>' : `<b>${v}</b>${max ? `<small class="muted"> / ${max}</small>` : ''}`;
  const tries = n => n ? `${n}번` : '<span class="muted">-</span>';
  const cards = allUnits.map(u => {
    const p = prog(u), d = S.data[u];
    const sentList = d ? d.sentences.map((s, k) => ({ k: k + 1, text: s.zh, e: (p.sent || {})[k + 1] })) :
      Object.keys(p.sent || {}).map(k => ({ k: +k, text: p.sent[k].text, e: p.sent[k] })).sort((a, b) => a.k - b.k);
    const nums = sentList.filter(x => x.e && x.e.best != null).map(x => x.e.best);
    const sAvg = nums.length ? Math.round(avg(nums)) : null;
    const nEval = sentList.filter(x => x.e && (x.e.best != null || x.e.status === '확인 필요')).length;
    const started = ACTS.some(a => p.done[a.key]) || Object.keys(p.sent || {}).length;
    return `<div class="paper rec-unit">
      <div class="row" style="justify-content:space-between;align-items:flex-end">
        <h2 class="${isZh(u) ? 'zh' : ''}" style="margin:0">${esc(u)}</h2>
        <div class="score-pill" style="color:var(--red);font-size:24px">${unitTotal(u)}<small> / ${UNIT_MAX()}점</small></div></div>
      ${!started ? '<p class="muted" style="margin:8px 0 0">아직 시작하지 않은 단원이에요.</p>' : `
      <table class="rtab"><thead><tr><th>단계</th><th>점수</th><th>도전</th><th>상태</th></tr></thead><tbody>
        <tr><td>① 어휘 학습</td><td class="muted">점수 없음</td><td>${tries(p.tries.vocab_learn)}</td><td>${isDone('vocab_learn', u) ? '<span class="ok">✓ 완료</span>' : p.done.vocab_learn ? '<span class="muted">1/2 활동</span>' : '<span class="muted">아직</span>'}</td></tr>
        ${VLEARN.map(a => `<tr class="sub"><td>· ${a.icon} ${a.name}</td><td></td><td>${tries(p.lsub && p.lsub[a.name])}</td><td>${learnDone(a.name, u) ? '<span class="ok">✓</span>' : ''}</td></tr>`).join('')}
        <tr><td>② 어휘 게임</td><td>${cell(p.games && Object.keys(p.games).length ? p.scores.vocab_game || 0 : null, VG_MAX())}</td><td>${tries(p.tries.vocab_game)}</td><td>${isDone('vocab_game', u) ? '<span class="ok">✓ 완료</span>' : Object.keys(p.games || {}).length ? `<span class="muted">게임 ${gamesLeft(u).length}개 남음</span>` : '<span class="muted">아직</span>'}</td></tr>
        ${VGAMES.map(g => `<tr class="sub"><td>· ${g.icon} ${g.name}</td><td>${cell(p.games && p.games[g.name] != null ? p.games[g.name] : null, 100)}</td><td>${tries(p.gtries && p.gtries[g.name])}</td><td></td></tr>`).join('')}
        <tr><td>③ 문장 학습</td><td>${sAvg == null ? '<span class="muted">-</span>' : `평균 <b>${sAvg}</b>`}</td><td>${nEval}/${d ? d.sentences.length : sentList.length}문장</td><td>${p.done.sent_learn ? '<span class="ok">✓ 완료</span>' : '<span class="muted">아직</span>'}</td></tr>
        ${sentList.map(x => `<tr class="sub"><td>· 문장 ${x.k} <span class="zh" lang="zh-CN" style="font-size:15px">${esc(x.text || '')}</span></td>
          <td>${x.e ? (x.e.best != null ? cell(x.e.best, 100) : '<span class="muted">선생님 확인</span>') : '<span class="muted">-</span>'}</td><td>${tries(x.e && x.e.evals)}</td><td></td></tr>`).join('')}
        <tr><td>④ 문장 게임</td><td>${cell(p.done.sent_game ? p.scores.sent_game || 0 : null, 100)}</td><td>${tries(p.tries.sent_game)}</td><td>${p.done.sent_game ? '<span class="ok">✓ 완료</span>' : '<span class="muted">아직</span>'}</td></tr>
        <tr><td>⑤ 총정리 테스트</td><td>${cell(p.done.final_test ? p.scores.final_test || 0 : null, 100)}</td><td>${tries(p.tries.final_test)}</td><td>${p.done.final_test ? '<span class="ok">✓ 완료</span>' : '<span class="muted">아직</span>'}</td></tr>
      </tbody></table>`}
    </div>`;
  }).join('');
  show(`<div class="row"><button class="btn small" type="button" id="backU">← ${S.unit ? '단원 화면' : '단원 목록'}</button></div>
    <div class="pagehead"><div><h1>내 학습 기록</h1><div class="sub">${esc(S.me.sid)} ${esc(S.me.name)} · 점수는 활동마다 가장 높은 점수예요</div></div>
      <div class="score-pill" style="color:var(--gold);font-size:26px">${grand}<small style="color:var(--muted)">점 · 전체 단원 합계</small></div></div>
    ${cards || '<div class="paper">아직 기록이 없어요.</div>'}`);
  $('#backU').addEventListener('click', () => back());
}

/* ======================== 시작 ======================== */
loginView();
</script>
</body>
</html>
